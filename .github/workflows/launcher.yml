name: Build launcher installers

on:
  release:
    types: [published]
  workflow_dispatch:
  # Changing the launcher, or this very workflow, rebuilds it: compiling the
  # application is the only way to tell whether it still builds at all. Pull
  # requests only build Linux, releases and manual runs all three.
  pull_request:
    paths:
      - "launcher/**"
      - "frontend/**"
      - ".github/workflows/launcher.yml"

# Only the release event needs to write, to attach the installers.
permissions:
  contents: write

concurrency:
  group: launcher-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - name: Pick the platforms to build
        id: platforms
        shell: bash
        run: |
          linux='{"label":"Linux","os":"ubuntu-22.04","target":"","bundles":"deb,appimage"}'
          macos='{"label":"macOS","os":"macos-14","target":"universal-apple-darwin","bundles":"app,dmg"}'
          windows='{"label":"Windows","os":"windows-latest","target":"","bundles":"nsis,msi"}'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            include="$linux"
          else
            include="$macos,$linux,$windows"
          fi
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            patchelf

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add the Apple architectures
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri -> target
          key: ${{ matrix.label }}

      # The launcher has no lockfile: the dashboard it embeds is pinned by the
      # frontend package, and the desktop dependencies follow the Tauri release
      # the toolchain provides.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        working-directory: launcher

      - name: Run the launcher tests
        run: pnpm run test
        working-directory: launcher

      - name: Generate the application icons
        run: pnpm run icons
        working-directory: launcher

      - name: Take the version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            node -e "const fs=require('fs');const p='launcher/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p));c.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n')" "$version"
            echo "Building version $version."
          else
            echo "Tag '$tag' is not a plain version, keeping the configured one."
          fi

      - name: Build the installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        working-directory: launcher

      - name: Collect the installers
        id: collect
        shell: bash
        run: |
          mkdir -p artifacts
          base=launcher/src-tauri/target
          if [ -n "${{ matrix.target }}" ]; then
            base="$base/${{ matrix.target }}"
          fi
          find "$base/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.rpm' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} artifacts/ \;
          ls -l artifacts

      - name: Publish the installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qibocal-launcher-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach the installers to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber
