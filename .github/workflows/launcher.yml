name: Build launcher installers

on:
  release:
    types: [published]
  workflow_dispatch:
  # Changing the launcher, or this very workflow, rebuilds everything: the
  # installers are the only way to tell whether the desktop application still
  # builds on the three platforms. The Python package too: the application
  # installs the qibocal-report of the very commit it is built from, and
  # embeds the notebook worker's source, so a change there reaches it only
  # through a new build.
  pull_request:
    paths:
      - "launcher/**"
      - "frontend/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/launcher.yml"
  # Work that lands on main directly is built the same way.
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - "frontend/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/launcher.yml"

# Read only: the release job alone writes, to attach the installers.
permissions:
  contents: read

concurrency:
  group: launcher-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only: Intel Macs are legacy, and a universal
          # binary compiles everything twice. The runner is ARM, so this is
          # its own target, and needs no other installed.
          - label: macOS
            os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: Linux
            os: ubuntu-22.04
            target: ""
            # Three packages from the one build; each goes up as an artifact of its own.
            bundles: deb,rpm,appimage
          - label: Windows
            os: windows-latest
            target: ""
            bundles: nsis,msi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            patchelf

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Keyed on Cargo.lock, so a cache matches the crates it holds (#81).
      # The prefix starts the caches afresh: v1 leaves behind the macOS one
      # saved by the universal build, twice the size. Only main saves, so
      # pull requests restore its caches without filling the quota.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: launcher/src-tauri -> target
          key: ${{ matrix.label }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Both lockfiles are committed, and a build takes them as they are: a
      # tag rebuilds with the dependencies it was released with. A lockfile
      # out of step with its manifest fails here, rather than being updated.
      - name: Check the Rust lockfile
        run: cargo fetch --locked
        working-directory: launcher/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: launcher

      - name: Run the launcher tests
        run: pnpm run test
        working-directory: launcher

      - name: Generate the application icons
        run: pnpm run icons
        working-directory: launcher

      # The version is the Python package's, in pyproject.toml, which the tag
      # must name: v0.1.0a1 is 0.1.0a1. The application is X.Y.Z, which every
      # installer format takes; a pre-release is told where each allows it:
      # the MSI's fourth field — alphas from 1, betas from 101, candidates
      # from 201, a final 1000 — and the RPM release, 0.a1 before a final's 1.
      - name: Take the version from the release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          if [[ "$version" != "$declared" ]]; then
            echo "::error::Tag '$tag' names $version, but pyproject.toml declares $declared."
            exit 1
          fi
          if [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)((a|b|rc)([0-9]+))?$ ]]; then
            app="${BASH_REMATCH[1]}"
            case "${BASH_REMATCH[3]}" in
              a) build=$((BASH_REMATCH[4])); release="0.${BASH_REMATCH[2]}" ;;
              b) build=$((100 + BASH_REMATCH[4])); release="0.${BASH_REMATCH[2]}" ;;
              rc) build=$((200 + BASH_REMATCH[4])); release="0.${BASH_REMATCH[2]}" ;;
              *) build=1000; release="1" ;;
            esac
          else
            echo "::error::Version $version is not X.Y.Z, nor X.Y.Z followed by aN, bN or rcN."
            exit 1
          fi
          node -e "
            const fs = require('fs')
            const p = 'launcher/src-tauri/tauri.conf.json'
            const c = JSON.parse(fs.readFileSync(p))
            const [app, msi, rpm] = process.argv.slice(1)
            c.version = app
            c.bundle ??= {}
            c.bundle.windows ??= {}
            c.bundle.windows.wix = { ...(c.bundle.windows.wix || {}), version: msi }
            c.bundle.linux ??= {}
            c.bundle.linux.rpm = { ...(c.bundle.linux.rpm || {}), release: rpm }
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n')
          " "$app" "$app.$build" "$release"
          echo "Building version $version: the application's $app, MSI $app.$build, RPM release $release."

      # Built on its own, and bounded, so that a stuck bundler is a failing
      # step with its own log rather than an hour of apparent compilation:
      # `tauri build` runs it again through `beforeBuildCommand`, which costs
      # a minute and keeps the command usable outside of here.
      - name: Build the web assets
        run: pnpm run build
        working-directory: launcher
        timeout-minutes: 10

      # Without a Developer ID signature and Apple's notarization, macOS
      # refuses a downloaded application outright — "Apple could not verify
      # … is free of malware" — and only a trip through System Settings
      # opens it. The credentials are repository secrets, and the step is
      # skipped when they are missing: an unsigned build is still useful, a
      # half-configured one only fails. See docs/user-guide/launcher/installation.md.
      - name: Enable Apple code signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ACCOUNT: ${{ secrets.APPLE_ID }}
          APPLE_ACCOUNT_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERTIFICATE" ] || [ -z "$SIGNING_IDENTITY" ]; then
            # Ad-hoc signing convinces nobody, and Gatekeeper still refuses
            # the download, but it seals the bundle instead of shipping an
            # application whose only signature is the one the linker left on
            # its executable.
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::No Apple Developer ID configured: the build is"\
                 "only ad-hoc signed, and macOS will refuse it until the user"\
                 "allows it in System Settings → Privacy & Security."
            exit 0
          fi
          # The certificate is base64, which some tools wrap over several
          # lines: pass it through the delimited form, which takes either.
          {
            echo "APPLE_CERTIFICATE<<APPLE_CERTIFICATE_EOF"
            echo "$CERTIFICATE"
            echo "APPLE_CERTIFICATE_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          # Notarization needs the application signed first, and a few minutes
          # of waiting on Apple's service.
          if [ -n "$APPLE_ACCOUNT" ]; then
            {
              echo "APPLE_ID=$APPLE_ACCOUNT"
              echo "APPLE_PASSWORD=$APPLE_ACCOUNT_PASSWORD"
              echo "APPLE_TEAM_ID=$TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::Signing without notarizing: macOS still refuses"\
                 "downloaded applications it cannot check with Apple."
          fi

      # The launcher installs the qibocal-report it is built from, so the
      # command line it drives takes the flags it passes: build.rs reads the
      # commit — the branch head of a pull request, not its merge commit,
      # which the archive endpoint does not serve.
      - name: Build the installers
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        working-directory: launcher
        timeout-minutes: 45
        env:
          QIBOCAL_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          # A release names itself by its tag; anything else by its commit —
          # never by a branch, which moves.
          QIBOCAL_BUILD_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

      - name: Report what macOS will make of the result
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="launcher/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Qibocal.app"
          if [ ! -d "$app" ]; then
            echo "::warning::$app not found, skipping the assessment."
            exit 0
          fi
          codesign --display --verbose=2 "$app" 2>&1 || true
          if spctl --assess --type execute "$app" 2>&1; then
            echo "Gatekeeper accepts this build: it opens with a double click."
          else
            echo "::warning::Unsigned or un-notarized build: macOS will refuse it"\
                 "until the user allows it in System Settings → Privacy & Security."
          fi

      - name: Collect the installers
        id: collect
        shell: bash
        run: |
          mkdir -p artifacts
          base=launcher/src-tauri/target
          if [ -n "${{ matrix.target }}" ]; then
            base="$base/${{ matrix.target }}"
          fi
          find "$base/release/bundle" -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.rpm' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} artifacts/ \;
          ls -l artifacts

      - name: Publish the installers as artifacts
        if: matrix.label != 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: qibocal-launcher-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

      # Linux: one artifact per package format, so nobody downloads the
      # AppImage — the runtime it bundles makes it twenty times the .deb —
      # to get the one their distribution installs.
      - name: Publish the Debian package
        if: matrix.label == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: qibocal-launcher-Linux-deb
          path: artifacts/*.deb
          if-no-files-found: error

      - name: Publish the RPM package
        if: matrix.label == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: qibocal-launcher-Linux-rpm
          path: artifacts/*.rpm
          if-no-files-found: error

      - name: Publish the AppImage
        if: matrix.label == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: qibocal-launcher-Linux-appimage
          path: artifacts/*.AppImage
          if-no-files-found: error

  # The one job allowed to write: the installers of a release, attached to
  # it. Those of the platforms that built, when another one failed.
  release:
    name: Attach the installers to the release
    needs: build
    if: ${{ github.event_name == 'release' && !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download the installers
        uses: actions/download-artifact@v6
        with:
          pattern: qibocal-launcher-*
          path: artifacts
          merge-multiple: true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release upload "${{ github.event.release.tag_name }}" artifacts/* --clobber --repo "${{ github.repository }}"

  # The dashboard the launcher embeds has tests of its own, and the Linux
  # package is installed as a user would install it: a job after the build,
  # so that a failing test keeps no installer from being published, and
  # whoever downloads one gets it whether or not the tests passed.
  dashboard:
    name: Dashboard tests and a Linux install
    needs: build
    # A matrix is one job to depend on: this runs once all three builds
    # are done, and still when one of the other platforms failed, since
    # only the Linux package is needed here.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run the frontend tests
        run: pnpm run test
        working-directory: frontend

      - name: Download the Debian package
        uses: actions/download-artifact@v6
        with:
          name: qibocal-launcher-Linux-deb
          path: package

      # As a user would: apt resolves the package's dependencies, the
      # WebKitGTK runtime among them, and refuses a package that names
      # something the distribution does not have.
      - name: Install the package
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          ls -l package
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ./package/*.deb xvfb
          name=$(dpkg-deb --field package/*.deb Package)
          echo "PACKAGE=$name" >> "$GITHUB_ENV"
          dpkg --status "$name"
          dpkg --listfiles "$name"

      # The application opened once, on a display of its own: it has to
      # stay up for the whole of the time given — a crash on start, a
      # library missing at run time, exits early — and is then stopped,
      # which is the exit this step expects.
      - name: Open the application once
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          binary=$(dpkg --listfiles "$PACKAGE" | grep -m1 '^/usr/bin/')
          echo "Opening $binary"
          set +e
          timeout --signal=TERM 20 xvfb-run --auto-servernum "$binary"
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "The application stayed up until it was stopped."
          else
            echo "::error::The application exited on its own with status $status."
            exit 1
          fi
