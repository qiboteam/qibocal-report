  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a5cff" />
      <stop offset="1" stop-color="#6a21e0" />
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#surface)" />
  <g transform="translate(512 512) scale(22) translate(-16 -16)" fill="none">
    <ellipse
      cx="16" cy="16" rx="14" ry="6.4"
