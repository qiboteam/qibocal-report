[package]
name = "qibocal-launcher"
version = "0.1.0"
description = "Desktop launcher for Qibocal report servers and notebooks"
authors = ["Qibo Team"]
license = "Apache-2.0"
repository = "https://github.com/qiboteam/qibocal-report"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "qibocal_launcher"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The application is a thin shell around the web view: the fat LTO of the
# Tauri template costs tens of minutes of linking on a build machine and buys
# back a few hundred kilobytes.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
