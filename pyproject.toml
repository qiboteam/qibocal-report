[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "qibocal-report"
version = "0.1.0a1"
description = "The command line and report server of the Qibocal application"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Alessandro Candido" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pyjwt>=2.14.0",
    "packaging>=24.0",
    "strawberry-graphql>=0.240.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
qibocal = "qibocal_report.cli:main"

[tool.uv.build-backend]
source-include = ["docs/**", "data/**"]
data = { purelib = "docs", data = "data" }
